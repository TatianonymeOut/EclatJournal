name: Bug report
description: Tell us about a reproducible problem in Éclat Journal.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Éclat Journal. Do not include real journal entries, health data, personal media, credentials, or identifying information.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - macOS
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "For example: main at abc1234"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Use fictional sample data...
        2. Open...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Use only redacted screenshots and invented data.
